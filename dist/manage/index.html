<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>מלאי בקליק — ניהול לקוחות</title><link rel="stylesheet" href="../style.css"><script type="module" src="admin.mjs"></script><body><main><h1>ניהול לקוחות משלמים</h1><a href="../">חזרה לספירה</a><p id="message" role="status"></p><form id="login"><label>אימייל מנהל<input name="email" type="email" required autocomplete="username"></label><label>סיסמה<input name="password" type="password" required autocomplete="current-password"></label><button>כניסה</button></form><section id="panel" hidden><button id="logout">התנתקות</button><button id="refresh">רענון</button><p>הלקוח נרשם באפליקציה. לאחר בדיקת התשלום, בחר תוקף בכרטיס ולחץ פתיחה / הארכה. אין קודים או קישורי הפעלה. החשבון מאפשר שימוש במספר מכשירים; הספירות אינן מסתנכרנות ביניהם.</p><input id="search" placeholder="חיפוש עסק או אימייל"><div id="cards"></div></section></main></body></html>
